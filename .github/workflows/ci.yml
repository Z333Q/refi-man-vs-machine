name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

# Actions are pinned to commit SHAs (§3.4 / §3.3 repo-hygiene floor). Tag
# comments record the intended version; a version bump is a reviewed diff,
# not a silent tag shift. SHAs are kept in lockstep with the investor
# shell's CI (refi-us-sec-ia .github/workflows/ci.yml).

jobs:
  ci:
    name: Typecheck / Lint / Test / Build / Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Result-category label gate (§3.4 gate 1)
        run: npm run label-gate
      - name: Benchmark provenance gate (§3.4 gate 2)
        run: npm run provenance-gate

      - name: Viewport gate
        run: npm run viewport-gate
      - name: Em-dash gate
        run: npm run em-dash-gate
      - name: Build
        run: npm run build

  # The end-to-end suite existed for a week without ever running here, which
  # meant 47 specs covering the whole run loop were verified only when someone
  # happened to run them by hand on a laptop. That laptop's load average
  # swung between 11 and 300 during one afternoon, and wall time for the suite
  # swung with it — 2.6 minutes quiet, 12.4 minutes busy — which produced
  # timeouts that looked like flakes and cost real time to disprove. A
  # dedicated runner removes the variable entirely.
  e2e:
    name: End-to-end (desktop + phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
        env:
          # The app will not boot without these, and CI has no .env, so without
          # values every spec fails at the first render. The anon key is public
          # by design and the suite never signs in; the fallbacks keep the job
          # working on forks where the secrets are not available.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  schema:
    name: Schema (real PostgreSQL)
    runs-on: ubuntu-latest
    # The schema makes promises only a database can check: that a player can
    # play with no account, that linking one later loses nothing, that a person
    # can hold several logins, and that closing an account does not delete the
    # play behind it. Reading the DDL verifies none of that, so CI runs it
    # against an actual PostgreSQL.
    #
    # Pinned by digest for the same reason the actions are: a version bump is a
    # reviewed diff, not a silent tag shift.
    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 # 16-alpine
        env:
          POSTGRES_USER: refi
          POSTGRES_PASSWORD: refi
          POSTGRES_DB: refi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply the founding schema and test it
        env:
          DATABASE_URL: postgresql://refi:refi@localhost:5432/refi_test
        run: npm run test:schema

  handoff:
    name: Handoff / Typecheck / Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/handoff
    # A real database, because the mocked tests cannot see schema drift. The
    # service's progress reads fail soft to zero by design, so a query that no
    # longer matches the schema does not crash: it silently mints tokens
    # claiming the player has done nothing. Only a real query catches that.
    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 # 16-alpine
        env:
          POSTGRES_USER: refi
          POSTGRES_PASSWORD: refi
          POSTGRES_DB: refi_handoff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/handoff/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        env:
          # Present, so the integration tests run rather than skip. They apply
          # db/migrations/0001_founding_schema.sql themselves.
          DATABASE_URL: postgresql://refi:refi@localhost:5432/refi_handoff_test
        run: npm test

  persistence-api:
    name: Persistence API / Typecheck / Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/persistence-api
    # A real database, for the same reason the handoff job has one: this
    # service owns both directions of the domain-object <-> row mapping, and
    # the round-trip claim (what a PUT stores, a GET reproduces exactly) is
    # only checkable against real PostgreSQL.
    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 # 16-alpine
        env:
          POSTGRES_USER: refi
          POSTGRES_PASSWORD: refi
          POSTGRES_DB: refi_persistence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/persistence-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        env:
          # Present, so the integration tests run rather than skip. They apply
          # db/migrations/0001_founding_schema.sql themselves.
          DATABASE_URL: postgresql://refi:refi@localhost:5432/refi_persistence_test
        run: npm test
      - name: Build
        run: npm run build

  security:
    name: Security scans (§3.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      # gitleaks scans history for committed secrets (the Bolt-era .env
      # is git-ignored; this fails the build if one was ever committed).
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # osv-scanner walks the lockfiles for known vulnerabilities. It ships as a
  # reusable workflow, so it has to be called at the job level: a reusable
  # workflow used inside `steps:` is rejected when the workflow file is parsed,
  # which produced runs with zero jobs and no usable error on the run page.
  #
  # The gate is scoped to production dependencies via osv-scanner.toml. That is
  # a scope decision, not a suppression: no advisory is ignored by id, and a
  # runtime vulnerability still fails the build.
  security-osv:
    name: OSV dependency scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --config=./osv-scanner.toml
        --lockfile=package-lock.json
        --recursive
        ./
